version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One pull request for the dev toolchain, which moves often and is not shipped.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    # Two TypeScript majors are installed on purpose, and neither is redundant. The peer
    # range is the wide `>=5`, satisfied two different ways: 5 and 6 are read through the
    # syntax tree, 7 through the token scanner it left behind. The suite runs both readers
    # over one corpus and requires identical results, so `typescript` and the aliased
    # `typescript-next` both have to stay.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
