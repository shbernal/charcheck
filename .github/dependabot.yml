version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One pull request for the dev toolchain, which moves often and is not shipped.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Not a cap on what charcheck supports. The peer range is the wide `>=5`, and 7 is
      # supported: 5 and 6 are read through the syntax tree, 7 through the token scanner it
      # left behind. This holds the *devDependency* below 7 so that both readers keep a
      # compiler to run against, because the suite proves they agree by running them over one
      # corpus, and `tests/typescript-7.test.ts` asserts as much: a 7 under the
      # `typescript-next` alias, a 6 under the plain name. Bumping this one to 7 would
      # leave the syntax-tree reader with nothing to read.
      - dependency-name: typescript
        versions: ['>=7']
      # The floor of the peer range, read through the same syntax tree reader as 6 so the
      # suite proves the bottom of `>=5` rather than asserting it. Held at 5, or it stops
      # being the floor; `tests/typescript-7.test.ts` asserts the major.
      - dependency-name: typescript-floor
        versions: ['>=6']
      # Both aliases are bumped by hand. Dependabot does not reliably follow an `npm:` alias,
      # so a new 7.x for `typescript-next` or 5.x for `typescript-floor` will not open a pull
      # request on its own, and the ignore above is a guard rather than a promise of updates.

      # Matches the `engines` floor, so the compiler rejects an API Node 24 does not have.
      # Moves only when the floor does.
      - dependency-name: '@types/node'
        versions: ['>=25']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
