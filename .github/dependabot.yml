version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One pull request for the dev toolchain, which moves often and is not shipped.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The peer is deliberately capped below 7: TypeScript 7 is the native compiler and
      # no longer exposes the JavaScript parser the `strings` scope is built on. Lifting
      # that cap is a code change, not a version bump.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
