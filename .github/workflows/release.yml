name: Release

# Tag a commit `v0.1.0` and push it. The version in package.json must already match;
# this workflow publishes, it does not bump.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - name: Refuse a tag that disagrees with package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
